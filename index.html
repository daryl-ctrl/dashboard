<!DOCTYPE html>
<html>
<head>
<title>SupplementSource Mission Control</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    background:#000;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

.container{
    display:flex;
    flex-direction:column;
    height:100vh;
    width:100vw;
}

.section{
    border-bottom:2px solid #111;
    overflow:hidden;
}

.top{
    height:33%;
}

.middle{
    height:33%;
}

.bottom{
    height:34%;
}

iframe{
    width:100%;
    height:100%;
    border:none;
    background:#000;
}

.label{
    position:absolute;
    z-index:999;
    color:white;
    background:rgba(0,0,0,0.7);
    padding:6px 12px;
    font-size:20px;
    font-weight:bold;
    border-radius:10px;
    margin:10px;
}

.section-wrapper{
    position:relative;
    height:100%;
}

</style>
</head>

<body>

<div class="container">

    <div class="section top">
        <div class="section-wrapper">
            <div class="label">SHOPIFY ADMIN</div>

            <iframe
            src="https://admin.shopify.com/store/supplementsource">
            </iframe>

        </div>
    </div>

    <div class="section middle">
        <div class="section-wrapper">
            <div class="label">SHOPIFY ANALYTICS</div>

            <iframe
            src="https://admin.shopify.com/store/supplementsource/analytics">
            </iframe>

        </div>
    </div>

    <div class="section bottom">
        <div class="section-wrapper">
            <div class="label">MARKETS & CRYPTO</div>

            <iframe
            src="https://finance.yahoo.com/portfolios">
            </iframe>

        </div>
    </div>

</div>

</body>
</html>

</html>
