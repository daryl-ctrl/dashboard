<!DOCTYPE html>
<html>
<head>

<title>SupplementSource Mission Control</title>

<style>
body{
    margin:0;
    background:black;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
    font-size:40px;
}
</style>

<script>

const pages = [

"https://admin.shopify.com/store/supplementsource",

"https://admin.shopify.com/store/supplementsource/analytics",

"https://finance.yahoo.com/portfolios"

];

let current = localStorage.getItem("pageIndex");

if(current === null){
    current = 0;
}else{
    current = parseInt(current);
}

const nextPage = pages[current];

current++;

if(current >= pages.length){
    current = 0;
}

localStorage.setItem("pageIndex", current);

setTimeout(() => {
    window.location.href = nextPage;
}, 3000);

</script>

</head>

<body>

Loading Mission Control...

</body>
</html>
